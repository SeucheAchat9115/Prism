[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vibesound"
version = "0.1.0.dev0"
description = "A Python-first DAW designed for musicians and coding agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "pydantic>=2.10,<3",
    "sounddevice>=0.5,<1",
    "soundfile>=0.12,<1",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
plugins = [
    "pedalboard>=0.9,<1",
]

[project.scripts]
vibesound = "vibesound.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vibesound"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
