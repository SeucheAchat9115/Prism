[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vibesound"
version = "0.1.0.dev0"
description = "A Python-first DAW designed for musicians and coding agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.1,<3",
    "portalocker>=3,<5",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.18,<1",
    "sounddevice>=0.5,<1",
    "soundfile>=0.12,<1",
    "soxr>=0.5,<2",
    "typer>=0.15,<1",
    "uvicorn>=0.30,<1",
    "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
plugins = [
    "pedalboard>=0.9,<1",
]

[project.scripts]
vibesound = "vibesound.cli:app"

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/.wheel-*",
    "/dist",
    "**/*.vibesound-work/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibesound"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/examples",
    "/src",
    "/tests",
    "/.gitignore",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "audio_device: requires a real output device and is run manually",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["vibesound"]
omit = ["*/vibesound/audio/portaudio.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 85.0
