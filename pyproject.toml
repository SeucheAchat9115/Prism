[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.2.0.dev0"
description = "A script-first Python music package for reproducible songs and renders."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "soundfile>=0.12,<1",
    "soxr>=0.5,<2",
]

[project.scripts]
prism = "prism.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.16.5,<1",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=1.0.6,<2",
]
vst3 = [
    "dawdreamer>=0.9,<0.10",
]

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/.wheel-*",
    "/dist",
    "/docs/assets/audio",
    "/site",
    "**/renders/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/src",
    "/tests",
    "/.gitignore",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/GOVERNANCE.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["prism"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 85.0

