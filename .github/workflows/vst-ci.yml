name: VST3 integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: vst-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The real qualification fixtures are built from this exact upstream SDK
  # revision; no platform-specific plugin binary is committed to Prism.
  VST3_SDK_COMMIT: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
  # SHA-256 observed from the fixed upstream release URLs in CI run 33977585860.
  # Update URLs and hashes together in a reviewed PR; never learn hashes at runtime.
  SURGE_LINUX_SHA256: a6e55064487f624147d515b9ae5fc79a568b69746675b2083abde628ca7bb151
  SURGE_WINDOWS_SHA256: 6e221e05f29254508142b9e0ed76a85f22fa1b512501bebde571951e7eefecca
  SURGE_WINDOWS_URL: https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-win64-1.3.4-setup.exe
  SURGE_LINUX_URL: https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-linux-x64-1.3.4.deb

jobs:
  vst3:
    name: Real VST3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            libsndfile1 \
            libcairo2 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxcb-cursor0 \
            libxcb-xkb1 \
            libxcb1 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            xdg-utils \
            xclip

      - name: Install the locked VST3 environment
        run: uv sync --locked --extra dev --extra vst3

      - name: Build pinned Prism VST3 fixtures
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/vst3sdk"
          build="$RUNNER_TEMP/prism-vst3-fixtures-build"
          git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" fetch --depth 1 origin "$VST3_SDK_COMMIT"
          git -C "$sdk" checkout --detach "$VST3_SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive
          test "$(git -C "$sdk" rev-parse HEAD)" = "$VST3_SDK_COMMIT"
          cmake -S "$GITHUB_WORKSPACE/tests/fixtures/vst3" -B "$build" \
            -DPRISM_VST3_SDK_ROOT="$sdk" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build" --config Release \
            --target prism-fixture-delay prism-fixture-instrument

      - name: Configure Linux fixture paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build="$RUNNER_TEMP/prism-vst3-fixtures-build"
          delay="$(find "$build" -type d -name 'prism-fixture-delay.vst3' -print -quit)"
          instrument="$(find "$build" -type d -name 'prism-fixture-instrument.vst3' -print -quit)"
          test -n "$delay"
          test -n "$instrument"
          echo "PRISM_FIXTURE_EFFECT_VST3=$delay" >> "$GITHUB_ENV"
          echo "PRISM_FIXTURE_INSTRUMENT_VST3=$instrument" >> "$GITHUB_ENV"
          echo "PRISM_VST_DIAGNOSTICS_DIR=$RUNNER_TEMP/prism-vst-diagnostics" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prism-vst-diagnostics"

      - name: Configure Windows fixture paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'prism-vst3-fixtures-build'
          $delay = Get-ChildItem -Path $build -Directory -Filter 'prism-fixture-delay.vst3' -Recurse | Select-Object -First 1
          $instrument = Get-ChildItem -Path $build -Directory -Filter 'prism-fixture-instrument.vst3' -Recurse | Select-Object -First 1
          if ($null -eq $delay -or $null -eq $instrument) {
            throw 'Could not locate the built Prism VST3 fixture bundles.'
          }
          "PRISM_FIXTURE_EFFECT_VST3=$($delay.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRISM_FIXTURE_INSTRUMENT_VST3=$($instrument.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $diagnostics = Join-Path $env:RUNNER_TEMP 'prism-vst-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          "PRISM_VST_DIAGNOSTICS_DIR=$diagnostics" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Surge XT on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/surge-xt.deb"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "$SURGE_LINUX_URL"
          echo "$SURGE_LINUX_SHA256  $archive" | sha256sum --check --strict
          sudo apt-get install -y "$archive"
          test -d "/usr/lib/vst3/Surge XT.vst3"
          test -d "/usr/lib/vst3/Surge XT Effects.vst3"
          {
            echo "PRISM_SURGE_INSTRUMENT_VST3=/usr/lib/vst3/Surge XT.vst3"
            echo "PRISM_SURGE_EFFECT_VST3=/usr/lib/vst3/Surge XT Effects.vst3"
          } >> "$GITHUB_ENV"

      - name: Install Surge XT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'surge-xt-setup.exe'
          Invoke-WebRequest -Uri $env:SURGE_WINDOWS_URL -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash
          if ($actualHash -ne $env:SURGE_WINDOWS_SHA256) {
            throw "Surge XT installer SHA-256 mismatch; refusing to execute it."
          }
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Surge XT installer exited with code $($process.ExitCode)."
          }
          $roots = @(
            (Join-Path $env:CommonProgramFiles 'VST3'),
            (Join-Path $env:ProgramFiles 'VST3')
          )
          $instrument = Get-ChildItem -Path $roots -Directory -Filter 'Surge XT.vst3' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $effect = Get-ChildItem -Path $roots -Directory -Filter 'Surge XT Effects.vst3' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $instrument -or $null -eq $effect) {
            throw 'Could not locate the installed Surge XT VST3 bundles.'
          }
          "PRISM_SURGE_INSTRUMENT_VST3=$($instrument.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRISM_SURGE_EFFECT_VST3=$($effect.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run real VST3 smoke tests
        run: uv run pytest tests/test_real_vst.py -q

      - name: Upload VST audio diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prism-vst-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/prism-vst-diagnostics
          if-no-files-found: ignore

