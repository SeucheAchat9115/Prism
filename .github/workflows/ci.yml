name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Device-free validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Linux audio runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1

      - name: Install project dependencies
        run: uv sync --locked --extra dev

      - name: Run device-free tests and coverage gate
        run: uv run pytest -m "not audio_device" --cov --cov-report=term-missing

      - name: Run strict type checks
        run: uv run mypy src/vibesound

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run command smoke checks
        run: |
          uv run python -m vibesound --help
          uv run vibesound version
          uv run vibesound version --json
          uv run vibesound project init ci-smoke.vibesound-work --dry-run --json

  package:
    name: Build and clean-wheel acceptance
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build wheel and source archive
        run: uv build --no-sources

      - name: Install exact wheel into a clean environment
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          uv venv .wheel-smoke --python 3.12
          uv pip install --python .wheel-smoke\Scripts\python.exe $wheel

      - name: Run installed acceptance launcher
        shell: pwsh
        run: |
          .wheel-smoke\Scripts\vibesound.exe version
          .wheel-smoke\Scripts\vibesound.exe demo "$env:RUNNER_TEMP\vibesound-demo.vibesound-work" --no-serve
          .wheel-smoke\Scripts\vibesound.exe serve "$env:RUNNER_TEMP\vibesound-demo.vibesound-work" --dry-run --json
