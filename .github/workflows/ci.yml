name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install libsndfile on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install the locked development environment
        run: uv sync --locked --extra dev

      - name: Run tests and coverage
        run: uv run pytest --cov --cov-report=term-missing

      - name: Run strict type checks
        run: uv run mypy src/prism

      - name: Run lint checks
        run: uv run ruff check .

  package:
    name: Build and clean-wheel smoke test
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build wheel and source archive
        run: uv build --no-sources

      - name: Install and exercise the exact wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          uv venv .wheel-smoke --python 3.12
          uv pip install --python .wheel-smoke\Scripts\python.exe $wheel
          .wheel-smoke\Scripts\python.exe ci\wheel_smoke.py
          .wheel-smoke\Scripts\prism.exe create .wheel-project --name "CLI Wheel Smoke" --tempo 104
          .wheel-smoke\Scripts\python.exe .wheel-project\main.py
          if (-not (Test-Path -LiteralPath .wheel-project\renders\song.wav)) {
            throw "The generated project did not render a WAV file."
          }
          if (Test-Path -LiteralPath .wheel-project.zip) {
            throw "The create command produced an archive instead of a folder."
          }
